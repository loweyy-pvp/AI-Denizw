<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Denizw AI</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#060608;
  --s1:#0d0d12;
  --s2:#13131c;
  --border:#1e1e2e;
  --border2:#2a2a3f;
  --c1:#e879f9;
  --c2:#38bdf8;
  --c3:#a3e635;
  --text:#f0f0ff;
  --muted:#52527a;
  --muted2:#3a3a5c;
}

html,body{height:100%}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  overflow-x:hidden;
}

/* grid bg */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(232,121,249,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,121,249,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
}

body::after{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 10%, rgba(232,121,249,0.08) 0%, transparent 55%),
    radial-gradient(ellipse 60% 50% at 85% 90%, rgba(56,189,248,0.07) 0%, transparent 55%);
  pointer-events:none;
  z-index:0;
}

.page{
  width:100%;
  max-width:820px;
  display:flex;
  flex-direction:column;
  height:100vh;
  padding:0 16px;
  position:relative;
  z-index:1;
}

/* ── HEADER ── */
header{
  display:flex;
  align-items:center;
  gap:14px;
  padding:20px 0 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.logo-wrap{
  position:relative;
  width:44px;height:44px;
}

.logo-wrap .ring{
  position:absolute;inset:0;
  border-radius:12px;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  animation:spin 4s linear infinite;
}

@keyframes spin{to{filter:hue-rotate(360deg)}}

.logo-inner{
  position:absolute;
  inset:2px;
  background:var(--s1);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;
}

.header-text h1{
  font-size:1.45rem;
  font-weight:800;
  letter-spacing:-0.03em;
  background:linear-gradient(90deg,var(--c1),var(--c2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.header-text p{
  font-size:0.72rem;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  margin-top:1px;
}

.status-dot{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:0.75rem;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}

.dot{
  width:7px;height:7px;
  border-radius:50%;
  background:var(--c3);
  box-shadow:0 0 8px var(--c3);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.5;transform:scale(0.8)}
}

/* ── API KEY PANEL ── */
.api-panel{
  margin:14px 0 0;
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  flex-shrink:0;
  transition:all 0.3s;
}

.api-panel.hidden{
  display:none;
}

.api-label{
  font-size:0.7rem;
  font-family:'JetBrains Mono',monospace;
  color:var(--muted);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}

.api-label span{
  color:var(--c1);
}

.api-row{
  display:flex;
  gap:8px;
}

#apiKeyInput{
  flex:1;
  background:var(--bg);
  border:1px solid var(--border2);
  border-radius:9px;
  padding:9px 13px;
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:0.82rem;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}

#apiKeyInput:focus{
  border-color:var(--c1);
  box-shadow:0 0 0 3px rgba(232,121,249,0.1);
}

#apiKeyInput::placeholder{color:var(--muted2)}

#saveKey{
  background:linear-gradient(135deg,var(--c1),#a855f7);
  border:none;
  border-radius:9px;
  padding:9px 18px;
  color:#fff;
  font-family:'Outfit',sans-serif;
  font-weight:600;
  font-size:0.85rem;
  cursor:pointer;
  transition:opacity 0.2s,transform 0.15s;
  white-space:nowrap;
}

#saveKey:hover{opacity:0.85;transform:scale(1.03)}

#keyStatus{
  font-size:0.72rem;
  font-family:'JetBrains Mono',monospace;
  margin-top:7px;
  height:14px;
}
.ok{color:#4ade80}
.err{color:#f87171}

/* ── CHAT ── */
#chatbox{
  flex:1;
  overflow-y:auto;
  padding:20px 0;
  display:flex;
  flex-direction:column;
  gap:16px;
  scroll-behavior:smooth;
}

#chatbox::-webkit-scrollbar{width:3px}
#chatbox::-webkit-scrollbar-track{background:transparent}
#chatbox::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* empty state */
.empty{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  color:var(--muted);
  text-align:center;
  padding:40px 0;
}

.empty-icon{
  width:64px;height:64px;
  border-radius:20px;
  background:linear-gradient(135deg,rgba(232,121,249,0.15),rgba(56,189,248,0.15));
  border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;
}

.empty h2{
  font-size:1.1rem;
  font-weight:600;
  color:var(--text);
  opacity:0.7;
}

.empty p{
  font-size:0.82rem;
  max-width:260px;
  line-height:1.6;
}

/* suggestions */
.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:4px;
}

.sug-btn{
  background:var(--s2);
  border:1px solid var(--border2);
  border-radius:20px;
  padding:7px 14px;
  color:var(--text);
  font-family:'Outfit',sans-serif;
  font-size:0.78rem;
  cursor:pointer;
  transition:all 0.2s;
  opacity:0.7;
}

.sug-btn:hover{
  border-color:var(--c1);
  color:var(--c1);
  opacity:1;
}

/* messages */
.msg{
  display:flex;
  gap:10px;
  animation:fadeIn 0.25s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

.msg.user{flex-direction:row-reverse}

.av{
  width:34px;height:34px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
  flex-shrink:0;
  margin-top:2px;
}

.msg.user .av{
  background:linear-gradient(135deg,var(--c1),#a855f7);
}

.msg.ai .av{
  background:linear-gradient(135deg,#0e7490,var(--c2));
  border:1px solid rgba(56,189,248,0.3);
}

.bbl{
  max-width:72%;
  padding:12px 16px;
  border-radius:16px;
  font-size:0.92rem;
  line-height:1.65;
  word-break:break-word;
}

.msg.user .bbl{
  background:linear-gradient(135deg,rgba(232,121,249,0.12),rgba(168,85,247,0.1));
  border:1px solid rgba(232,121,249,0.2);
  border-top-right-radius:4px;
}

.msg.ai .bbl{
  background:var(--s2);
  border:1px solid var(--border);
  border-top-left-radius:4px;
}

/* typing */
.typing-dots span{
  display:inline-block;
  width:5px;height:5px;
  background:var(--c2);
  border-radius:50%;
  margin:0 2px;
  animation:blink 1.2s infinite;
}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}

@keyframes blink{
  0%,80%,100%{opacity:0.2;transform:scale(0.8)}
  40%{opacity:1;transform:scale(1)}
}

/* ── INPUT ── */
.input-wrap{
  padding:14px 0 20px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}

.input-box{
  display:flex;
  gap:10px;
  align-items:flex-end;
  background:var(--s1);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:10px 10px 10px 16px;
  transition:border-color 0.2s,box-shadow 0.2s;
}

.input-box:focus-within{
  border-color:var(--c1);
  box-shadow:0 0 0 3px rgba(232,121,249,0.08);
}

#userInput{
  flex:1;
  background:transparent;
  border:none;
  color:var(--text);
  font-family:'Outfit',sans-serif;
  font-size:0.95rem;
  outline:none;
  resize:none;
  line-height:1.5;
  max-height:120px;
  overflow-y:auto;
}

#userInput::placeholder{color:var(--muted2)}

#sendBtn{
  width:40px;height:40px;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  border:none;
  border-radius:10px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:opacity 0.2s,transform 0.15s;
  font-size:1rem;
}

#sendBtn:hover{opacity:0.85;transform:scale(1.08)}
#sendBtn:disabled{opacity:0.35;cursor:not-allowed;transform:none}

.input-hint{
  font-size:0.68rem;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  text-align:center;
  margin-top:8px;
}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo-wrap">
      <div class="ring"></div>
      <div class="logo-inner">✦</div>
    </div>
    <div class="header-text">
      <h1>Denizw</h1>
      <p>AI · powered by Groq · llama3</p>
    </div>
    <div class="status-dot">
      <div class="dot"></div>
      online
    </div>
  </header>

  <div class="api-panel" id="apiPanel">
    <div class="api-label">🔑 GROQ API KEY — <span>introdu cheia ta pentru a folosi AI-ul</span></div>
    <div class="api-row">
      <input id="apiKeyInput" type="password" placeholder="gsk_..." autocomplete="off"/>
      <button id="saveKey" onclick="saveKey()">Salvează</button>
    </div>
    <div id="keyStatus"></div>
  </div>

  <div id="chatbox">
    <div class="empty" id="emptyState">
      <div class="empty-icon">🤖</div>
      <h2>Bun venit la Denizw!</h2>
      <p>Întreabă-mă orice. Sunt aici să te ajut.</p>
      <div class="suggestions">
        <button class="sug-btn" onclick="suggest(this)">Ce poți face?</button>
        <button class="sug-btn" onclick="suggest(this)">Explică-mi Minecraft</button>
        <button class="sug-btn" onclick="suggest(this)">Scrie un cod simplu</button>
        <button class="sug-btn" onclick="suggest(this)">Spune o glumă</button>
      </div>
    </div>
  </div>

  <div class="input-wrap">
    <div class="input-box">
      <textarea id="userInput" rows="1" placeholder="Scrie un mesaj..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="input-hint">Enter = trimite &nbsp;·&nbsp; Shift+Enter = linie nouă &nbsp;·&nbsp; API key salvat local în browser</div>
  </div>

</div>

<script>
let apiKey = localStorage.getItem('groq_key') || '';
let messages = [];

// init
if(apiKey){
  document.getElementById('apiKeyInput').value = '••••••••••••••';
  setStatus('✓ Cheie activă — poți începe să scrii!','ok');
}

function setStatus(msg, cls){
  const el = document.getElementById('keyStatus');
  el.textContent = msg;
  el.className = cls;
}

function saveKey(){
  const val = document.getElementById('apiKeyInput').value.trim();
  if(!val || val.startsWith('•')){
    setStatus('⚠ Introdu o cheie validă Groq.','err');
    return;
  }
  apiKey = val;
  localStorage.setItem('groq_key', val);
  document.getElementById('apiKeyInput').value = '••••••••••••••';
  setStatus('✓ Cheie salvată cu succes!','ok');
  setTimeout(()=>{ document.getElementById('apiPanel').classList.add('hidden'); }, 1200);
}

function autoResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
}

function suggest(btn){
  document.getElementById('userInput').value = btn.textContent;
  sendMessage();
}

function clearEmpty(){
  const e = document.getElementById('emptyState');
  if(e) e.remove();
}

function addMsg(role, html){
  clearEmpty();
  const box = document.getElementById('chatbox');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="av">${role==='user'?'👤':'✦'}</div>
    <div class="bbl">${html}</div>
  `;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function addTyping(){
  clearEmpty();
  const box = document.getElementById('chatbox');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="av">✦</div>
    <div class="bbl"><div class="typing-dots"><span></span><span></span><span></span></div></div>
  `;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escape(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function sendMessage(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;

  if(!apiKey){
    document.getElementById('apiPanel').classList.remove('hidden');
    setStatus('⚠ Introdu mai întâi cheia API!','err');
    return;
  }

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  addMsg('user', escape(text));
  messages.push({role:'user', content:text});
  addTyping();

  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':`Bearer ${apiKey}`
      },
      body:JSON.stringify({
        model:'llama3-8b-8192',
        messages:[
          {role:'system', content:'Ești Denizw, un asistent AI prietenos și deștept. Răspunde în română dacă ți se vorbește în română. Fii concis, clar și util.'},
          ...messages
        ],
        max_tokens:1024
      })
    });

    const data = await res.json();
    document.getElementById('typing-indicator')?.remove();

    if(data.error){
      addMsg('ai',`❌ Eroare: ${escape(data.error.message)}`);
    } else {
      const reply = data.choices[0].message.content;
      messages.push({role:'assistant', content:reply});
      addMsg('ai', escape(reply));
    }
  } catch(err){
    document.getElementById('typing-indicator')?.remove();
    addMsg('ai','❌ Eroare de conexiune. Verifică cheia API și conexiunea la internet.');
  }

  document.getElementById('sendBtn').disabled = false;
  input.focus();
}
</script>
</body>
</html>
