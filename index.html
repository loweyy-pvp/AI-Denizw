<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Denizw AI</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060608;--s1:#0d0d12;--s2:#13131c;
  --border:#1e1e2e;--border2:#2a2a3f;
  --c1:#e879f9;--c2:#38bdf8;--c3:#4ade80;
  --gold:#fbbf24;
  --text:#f0f0ff;--muted:#52527a;--muted2:#3a3a5c;--danger:#f87171;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(232,121,249,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,121,249,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 15% 10%,rgba(232,121,249,0.08) 0%,transparent 55%),radial-gradient(ellipse 60% 50% at 85% 90%,rgba(56,189,248,0.07) 0%,transparent 55%);pointer-events:none;z-index:0;}

/* AUTH */
#authScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.auth-card{background:var(--s1);border:1px solid var(--border2);border-radius:24px;padding:36px 32px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:24px;animation:fadeUp 0.4s ease;position:relative;z-index:1;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{display:flex;align-items:center;gap:12px;}
.auth-logo .ring{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.auth-logo h1{font-size:1.7rem;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.auth-logo p{font-size:0.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.auth-tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px;}
.auth-tab{flex:1;padding:9px;border:none;border-radius:7px;font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s;background:transparent;color:var(--muted);}
.auth-tab.active{background:var(--s2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.4);}
.auth-fields{display:flex;flex-direction:column;gap:12px;}
.auth-fields label{font-size:0.75rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:2px;display:block;}
.auth-fields input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'Outfit',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.auth-fields input:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(232,121,249,0.1);}
.auth-fields input::placeholder{color:var(--muted2)}
.auth-btn{background:linear-gradient(135deg,var(--c1),#a855f7);border:none;border-radius:11px;padding:13px;color:#fff;font-family:'Outfit',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:opacity 0.2s,transform 0.15s;width:100%;}
.auth-btn:hover{opacity:0.88;transform:scale(1.01)}
.auth-err{font-size:0.78rem;color:var(--danger);font-family:'JetBrains Mono',monospace;text-align:center;min-height:16px;}

/* APP */
#app{display:none;position:fixed;inset:0;flex-direction:row;z-index:1;}
.sidebar{width:260px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
.sidebar-top{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sidebar-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.sidebar-title{font-weight:800;font-size:1rem;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.new-chat-btn{margin:12px;background:linear-gradient(135deg,rgba(232,121,249,0.15),rgba(56,189,248,0.1));border:1px solid var(--border2);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Outfit',sans-serif;font-weight:600;font-size:0.85rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:8px;}
.new-chat-btn:hover{border-color:var(--c1);color:var(--c1);}
.chats-label{padding:8px 16px 4px;font-size:0.65rem;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:0.08em;}
.chats-list{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px;}
.chats-list::-webkit-scrollbar{width:3px}
.chats-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.chat-item{padding:9px 10px;border-radius:9px;cursor:pointer;transition:all 0.15s;font-size:0.83rem;color:var(--muted);display:flex;align-items:center;gap:6px;position:relative;}
.chat-item:hover{background:var(--s2);color:var(--text);}
.chat-item.active{background:rgba(232,121,249,0.1);color:var(--c1);border:1px solid rgba(232,121,249,0.2);}
.chat-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-item-name-input{flex:1;background:var(--bg);border:1px solid var(--c1);border-radius:6px;padding:2px 6px;color:var(--text);font-family:'Outfit',sans-serif;font-size:0.83rem;outline:none;}
.chat-actions{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity 0.15s;}
.chat-item:hover .chat-actions,.chat-item.active .chat-actions{opacity:1;}
.ca-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.72rem;padding:2px 4px;border-radius:4px;transition:color 0.15s;}
.ca-btn:hover{color:var(--text);}
.ca-btn.del:hover{color:var(--danger);}
.sidebar-bottom{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--s2);}
.user-av{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:700;flex-shrink:0;}
.user-av.admin{background:linear-gradient(135deg,var(--gold),#f97316);}
.user-av.normal{background:linear-gradient(135deg,var(--c1),#a855f7);}
.user-name{font-size:0.85rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.admin-badge{font-size:0.65rem;background:linear-gradient(135deg,var(--gold),#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700;font-family:'JetBrains Mono',monospace;}
.logout-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;padding:4px 6px;border-radius:6px;transition:all 0.15s;}
.logout-btn:hover{color:var(--danger);background:rgba(248,113,113,0.1);}

/* MODEL SELECTOR PILL */
.model-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--bg);border:1px solid var(--border2);
  border-radius:10px;padding:8px 10px;
  cursor:pointer;transition:all 0.2s;position:relative;
}
.model-pill:hover{border-color:var(--c1);}
.model-pill .mp-icon{font-size:1rem;flex-shrink:0;}
.model-pill .mp-info{flex:1;overflow:hidden;}
.model-pill .mp-name{font-size:0.78rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.model-pill .mp-cat{font-size:0.62rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.model-pill .mp-arrow{font-size:0.7rem;color:var(--muted);flex-shrink:0;}

/* MODEL DROPDOWN */
.model-dropdown{
  position:fixed;bottom:80px;left:12px;width:236px;
  background:var(--s1);border:1px solid var(--border2);
  border-radius:14px;padding:8px;
  z-index:200;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
  display:none;
  max-height:70vh;overflow-y:auto;
}
.model-dropdown.open{display:block;animation:fadeUp 0.2s ease;}
.model-dropdown::-webkit-scrollbar{width:3px}
.model-dropdown::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.md-section{padding:6px 8px 4px;font-size:0.62rem;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:0.08em;margin-top:4px;}
.md-section:first-child{margin-top:0;}
.model-option{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:9px;
  cursor:pointer;transition:all 0.15s;
  position:relative;
}
.model-option:hover:not(.locked){background:var(--s2);}
.model-option.active{background:rgba(232,121,249,0.1);border:1px solid rgba(232,121,249,0.2);}
.model-option.locked{opacity:0.45;cursor:not-allowed;}
.mo-icon{font-size:1.1rem;flex-shrink:0;width:24px;text-align:center;}
.mo-info{flex:1;overflow:hidden;}
.mo-name{font-size:0.82rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mo-desc{font-size:0.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mo-badge{font-size:0.6rem;padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-weight:600;flex-shrink:0;}
.mo-badge.free{background:rgba(74,222,128,0.15);color:var(--c3);border:1px solid rgba(74,222,128,0.3);}
.mo-badge.admin-only{background:rgba(251,191,36,0.15);color:var(--gold);border:1px solid rgba(251,191,36,0.3);}
.mo-lock{font-size:0.85rem;flex-shrink:0;opacity:0.6;}

/* CHAT AREA */
.chat-area{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative;z-index:1;}
.chat-header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.chat-header h2{font-size:0.95rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.model-badge-header{
  display:flex;align-items:center;gap:5px;
  background:var(--s2);border:1px solid var(--border2);
  border-radius:8px;padding:4px 10px;
  font-size:0.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);
  flex-shrink:0;
}
.model-badge-header .dot{width:5px;height:5px;border-radius:50%;background:var(--c3);box-shadow:0 0 5px var(--c3);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

#chatbox{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;}
#chatbox::-webkit-scrollbar{width:3px}
#chatbox::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;}
.empty-icon{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,rgba(232,121,249,0.12),rgba(56,189,248,0.12));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:1.6rem;}
.empty h2{font-size:1rem;font-weight:600;color:var(--text);opacity:0.6;}
.empty p{font-size:0.8rem;max-width:260px;line-height:1.6;}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px;}
.sug-btn{background:var(--s2);border:1px solid var(--border2);border-radius:20px;padding:7px 14px;color:var(--text);font-family:'Outfit',sans-serif;font-size:0.78rem;cursor:pointer;transition:all 0.2s;opacity:0.7;}
.sug-btn:hover{border-color:var(--c1);color:var(--c1);opacity:1;}

.msg{display:flex;gap:10px;animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse;}
.av{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px;}
.msg.user .av{background:linear-gradient(135deg,var(--c1),#a855f7);}
.msg.user.is-admin .av{background:linear-gradient(135deg,var(--gold),#f97316);}
.msg.ai .av{background:linear-gradient(135deg,#0e7490,var(--c2));border:1px solid rgba(56,189,248,0.3);}
.msg.system-msg .av{background:linear-gradient(135deg,#1e293b,#334155);}
.bbl{max-width:75%;padding:12px 16px;border-radius:16px;font-size:0.92rem;line-height:1.65;word-break:break-word;}
.msg.user .bbl{background:linear-gradient(135deg,rgba(232,121,249,0.12),rgba(168,85,247,0.1));border:1px solid rgba(232,121,249,0.2);border-top-right-radius:4px;}
.msg.user.is-admin .bbl{background:linear-gradient(135deg,rgba(251,191,36,0.12),rgba(249,115,22,0.1));border:1px solid rgba(251,191,36,0.25);}
.msg.ai .bbl{background:var(--s2);border:1px solid var(--border);border-top-left-radius:4px;}
.bbl img{max-width:100%;max-height:260px;border-radius:10px;margin-bottom:6px;display:block;}

.code-wrap{margin:8px 0;border-radius:12px;overflow:hidden;border:1px solid var(--border2);}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#1a1a2e;border-bottom:1px solid var(--border2);}
.code-lang{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--c2);}
.code-btns{display:flex;gap:6px;}
.code-btn{background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:4px 10px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:0.7rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:4px;}
.code-btn:hover{border-color:var(--c1);color:var(--c1);}
.code-btn.copied{border-color:var(--c3);color:var(--c3);}
.code-wrap pre{margin:0!important;border-radius:0!important;max-height:400px;overflow-y:auto;}
.code-wrap pre code{font-family:'JetBrains Mono',monospace!important;font-size:0.82rem!important;}
.bbl code:not(pre code){background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.2);border-radius:4px;padding:1px 6px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;color:var(--c2);}

.admin-panel{background:var(--s1);border:1px solid rgba(251,191,36,0.3);border-radius:14px;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:0.78rem;max-width:90%;}
.admin-panel .ap-title{color:var(--gold);font-weight:700;margin-bottom:10px;font-size:0.82rem;}
.admin-panel table{width:100%;border-collapse:collapse;}
.admin-panel th{color:var(--muted);font-size:0.7rem;text-align:left;padding:4px 8px;border-bottom:1px solid var(--border2);}
.admin-panel td{padding:6px 8px;color:var(--text);border-bottom:1px solid var(--border);}

.typing-dots span{display:inline-block;width:5px;height:5px;background:var(--c2);border-radius:50%;margin:0 2px;animation:blink 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0.2;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}

.input-wrap{padding:10px 24px 18px;border-top:1px solid var(--border);flex-shrink:0;}
#imgPreviewWrap{display:none;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--border2);border-radius:12px;padding:8px 12px;margin-bottom:8px;}
#imgPreviewWrap img{height:50px;width:50px;object-fit:cover;border-radius:8px;}
#imgPreviewWrap .img-name{font-size:0.78rem;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#imgPreviewWrap .remove-img{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:6px;}
#imgPreviewWrap .remove-img:hover{color:var(--danger);}
.input-box{display:flex;gap:8px;align-items:flex-end;background:var(--s1);border:1px solid var(--border2);border-radius:16px;padding:10px 10px 10px 14px;transition:border-color 0.2s,box-shadow 0.2s;}
.input-box:focus-within{border-color:var(--c1);box-shadow:0 0 0 3px rgba(232,121,249,0.08);}
#userInput{flex:1;background:transparent;border:none;color:var(--text);font-family:'Outfit',sans-serif;font-size:0.95rem;outline:none;resize:none;line-height:1.5;max-height:120px;overflow-y:auto;}
#userInput::placeholder{color:var(--muted2)}
.img-btn{width:38px;height:38px;background:var(--s2);border:1px solid var(--border2);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.1rem;transition:all 0.2s;color:var(--muted);}
.img-btn:hover{border-color:var(--c2);color:var(--c2);}
.img-btn.has-img{border-color:var(--c2);color:var(--c2);background:rgba(56,189,248,0.1);}
#sendBtn{width:40px;height:40px;background:linear-gradient(135deg,var(--c1),var(--c2));border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem;transition:opacity 0.2s,transform 0.15s;}
#sendBtn:hover{opacity:0.85;transform:scale(1.08)}
#sendBtn:disabled{opacity:0.35;cursor:not-allowed;transform:none}
.input-hint{font-size:0.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace;text-align:center;margin-top:7px;}
#fileInput{display:none;}

/* locked tooltip */
.lock-tooltip{position:fixed;background:var(--s1);border:1px solid rgba(251,191,36,0.4);border-radius:10px;padding:8px 12px;font-size:0.75rem;color:var(--gold);font-family:'JetBrains Mono',monospace;z-index:300;pointer-events:none;display:none;max-width:200px;text-align:center;}

.mob-menu{display:none;background:none;border:none;color:var(--text);font-size:1.3rem;cursor:pointer;padding:4px;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;}
@media(max-width:640px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:60;transition:left 0.3s;}
  .sidebar.open{left:0;}
  .sidebar-overlay.show{display:block;}
  .mob-menu{display:block;}
  .bbl{max-width:90%;}
  .model-dropdown{left:8px;width:calc(100vw - 16px);bottom:70px;}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="ring">✦</div>
      <div><h1>Denizw</h1><p>AI · powered by Groq</p></div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Intră în cont</button>
      <button class="auth-tab" onclick="switchTab('signup')">Cont nou</button>
    </div>
    <div class="auth-fields">
      <div><label>NUME DE UTILIZATOR</label><input id="authUser" type="text" placeholder="ex: loweyy" autocomplete="off"/></div>
      <div><label>PAROLĂ</label><input id="authPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth()"/></div>
    </div>
    <div class="auth-err" id="authErr"></div>
    <button class="auth-btn" onclick="doAuth()" id="authBtn">Intră în cont</button>
  </div>
</div>

<!-- MODEL DROPDOWN -->
<div class="model-dropdown" id="modelDropdown"></div>
<div class="lock-tooltip" id="lockTooltip">🔒 Doar pentru Admin</div>

<!-- APP -->
<div id="app">
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">✦</div>
      <span class="sidebar-title">Denizw</span>
    </div>
    <button class="new-chat-btn" onclick="newChat()">＋ Chat nou</button>
    <div class="chats-label">CONVERSAȚII</div>
    <div class="chats-list" id="chatsList"></div>
    <div class="sidebar-bottom">
      <div class="user-row">
        <div class="user-av" id="userAv"></div>
        <div style="flex:1;overflow:hidden">
          <div class="user-name" id="userNameDisplay"></div>
          <div class="admin-badge" id="adminBadge" style="display:none">👑 ADMIN</div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Ieși din cont">⏏</button>
      </div>
      <!-- model pill -->
      <div class="model-pill" id="modelPill" onclick="toggleModelDropdown()">
        <span class="mp-icon" id="pillIcon">🤖</span>
        <div class="mp-info">
          <div class="mp-name" id="pillName">Llama 4 Scout</div>

<script>
// ═══════════════════════════════════════════
//  ⚠️  PUNE API KEY-UL TĂU GROQ MAI JOS
// ═══════════════════════════════════════════
const GROQ_API_KEY = "PUNE_KEY_UL_TAU_AICI";
// ═══════════════════════════════════════════

const ADMIN_USER = "denizw";
const ADMIN_PASS_HASH = hash("denizwtest"); // schimbă parola aici

// ── ALL MODELS ──
const MODELS = [
  // TEXT TO TEXT
  { id:'llama-3.3-70b-versatile', name:'Llama 3.3 70B', cat:'Text · Multilingual', icon:'🦙', section:'TEXT TO TEXT', free:true,
    desc:'Rapid, multilingv, recomandat', adminOnly:false },
  { id:'meta-llama/llama-4-scout-17b-16e-instruct', name:'Llama 4 Scout', cat:'Vision · Multilingual', icon:'👁️', section:'TEXT TO TEXT', free:true,
    desc:'Vede poze, multilingv', adminOnly:false },
  { id:'llama-3.1-70b-versatile', name:'Llama 3.1 70B', cat:'Text · Puternic', icon:'🦙', section:'TEXT TO TEXT', free:true,
    desc:'Cel mai puternic Llama 3', adminOnly:false },

  // REASONING
  { id:'gpt-oss-120b', name:'GPT OSS 120B', cat:'Reasoning · Avansat', icon:'⚡', section:'REASONING', free:false,
    desc:'Cel mai puternic reasoning', adminOnly:true },
  { id:'gpt-oss-20b', name:'GPT OSS 20B', cat:'Reasoning · Rapid', icon:'⚡', section:'REASONING', free:false,

  { id:'qwen-qwq-32b', name:'Qwen 3 32B', cat:'Reasoning · Multilingv', icon:'🌐', section:'REASONING', free:false,
    desc:'Reasoning multilingv', adminOnly:true },

  // FUNCTION CALLING
  { id:'gpt-oss-120b-tools', name:'GPT OSS 120B Tools', cat:'Function Calling', icon:'🔧', section:'FUNCTION CALLING', free:false,
    desc:'Tool use avansat', adminOnly:true },
  { id:'gpt-oss-20b-tools', name:'GPT OSS 20B Tools', cat:'Function Calling · Rapid', icon:'🔧', section:'FUNCTION CALLING', free:false,
    desc:'Tool use rapid', adminOnly:true },
  { id:'qwen3-32b-tools', name:'Qwen 3 32B Tools', cat:'Function Calling', icon:'🔧', section:'FUNCTION CALLING', free:false,
    desc:'Tool use multilingv', adminOnly:true },
];

const DEFAULT_MODEL_ID = 'meta-llama/llama-4-scout-17b-16e-instruct';

let currentUser=null, isAdmin=false;
let currentChatId=null, messages=[];
let authMode='login', pendingImage=null;
let currentModel=MODELS.find(m=>m.id===DEFAULT_MODEL_ID);
let customSysPrompt=null;

// ── storage ──
function getUsers(){try{return JSON.parse(localStorage.getItem('dnz_users')||'{}')}catch(e){return{}}}
function saveUsers(u){localStorage.setItem('dnz_users',JSON.stringify(u))}
function getChats(user){try{return JSON.parse(localStorage.getItem('dnz_chats_'+user)||'[]')}catch(e){return[]}}
function saveChats(user,c){localStorage.setItem('dnz_chats_'+user,JSON.stringify(c))}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return h.toString(36)}

// ── MODEL DROPDOWN ──
function buildModelDropdown(){
  const dd=document.getElementById('modelDropdown');
  const sections=[...new Set(MODELS.map(m=>m.section))];
  let html='';
  sections.forEach(sec=>{
    html+=`<div class="md-section">${sec}</div>`;
    MODELS.filter(m=>m.section===sec).forEach(m=>{
      const locked=m.adminOnly&&!isAdmin;
      const active=currentModel.id===m.id;
      html+=`<div class="model-option ${locked?'locked':''} ${active?'active':''}" 
        data-id="${m.id}" onclick="selectModel('${m.id}',${locked})" 
        ${locked?`onmouseenter="showLockTip(event)" onmouseleave="hideLockTip()"`:''}
      >
        <span class="mo-icon">${m.icon}</span>
        <div class="mo-info">
          <div class="mo-name">${m.name}</div>
          <div class="mo-desc">${m.desc}</div>
        </div>
        ${locked
          ? `<span class="mo-lock">🔒</span>`
          : `<span class="mo-badge ${m.adminOnly?'admin-only':'free'}">${m.adminOnly?'ADMIN':'FREE'}</span>`
        }
      </div>`;
    });
  });
  dd.innerHTML=html;
}

function toggleModelDropdown(){
  const dd=document.getElementById('modelDropdown');
  buildModelDropdown();
  dd.classList.toggle('open');
  if(dd.classList.contains('open')){
    setTimeout(()=>document.addEventListener('click',closeDropdownOutside),50);
  }
}

function closeDropdownOutside(e){
  const dd=document.getElementById('modelDropdown');
  const pill=document.getElementById('modelPill');
  if(!dd.contains(e.target)&&!pill.contains(e.target)){
    dd.classList.remove('open');
    document.removeEventListener('click',closeDropdownOutside);
  }
}

function selectModel(id, locked){
  if(locked){ showLockMsg(); return; }
  const m=MODELS.find(x=>x.id===id);
  if(!m) return;
  currentModel=m;
  document.getElementById('pillIcon').textContent=m.icon;
  document.getElementById('pillName').textContent=m.name;
  document.getElementById('pillCat').textContent=m.cat;
  document.getElementById('headerModelName').textContent=m.name;
  document.getElementById('modelDropdown').classList.remove('open');
  document.removeEventListener('click',closeDropdownOutside);
}

function showLockTip(e){
  const tip=document.getElementById('lockTooltip');
  tip.style.display='block';
  tip.style.left=(e.clientX+10)+'px';
  tip.style.top=(e.clientY-40)+'px';
}
function hideLockTip(){
  document.getElementById('lockTooltip').style.display='none';
}
function showLockMsg(){
  showAdminPanel('🔒 MODEL BLOCAT',`<div style="color:var(--gold)">Acest model este disponibil doar pentru <b>Admin</b>.<br><br>Modelele gratuite disponibile pentru tine:<br><span style="color:var(--c3)">• Llama 4 Scout (poze)<br>• Llama 3.3 70B<br>• Llama 3.1 70B</span></div>`);
}

// ── auth ──
function switchTab(mode){
  authMode=mode;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',mode==='login'?i===0:i===1));
  document.getElementById('authBtn').textContent=mode==='login'?'Intră în cont':'Creează cont';
  document.getElementById('authErr').textContent='';
}
function doAuth(){
  const user=document.getElementById('authUser').value.trim().toLowerCase();
  const pass=document.getElementById('authPass').value;
  const err=document.getElementById('authErr');
  if(!user||!pass){err.textContent='Completează toate câmpurile.';return}
  if(user.length<3){err.textContent='Minim 3 caractere la nume.';return}
  if(pass.length<4){err.textContent='Minim 4 caractere la parolă.';return}
  if(user===ADMIN_USER){
    if(hash(pass)!==ADMIN_PASS_HASH){err.textContent='Parolă greșită.';return}
    startSession(user,true);return;
  }
  const users=getUsers();
  if(authMode==='signup'){
    if(users[user]){err.textContent='Numele e deja folosit.';return}
    users[user]=hash(pass);saveUsers(users);
    err.style.color='var(--c3)';err.textContent='Cont creat!';
    setTimeout(()=>{err.style.color='';startSession(user,false)},800);
  } else {
    if(!users[user]){err.textContent='Contul nu există.';return}
    if(users[user]!==hash(pass)){err.textContent='Parolă greșită.';return}
    startSession(user,false);
  }
}
function startSession(user,admin){
  currentUser=user;isAdmin=admin;
  // reset model to default on login
  currentModel=MODELS.find(m=>m.id===DEFAULT_MODEL_ID);
  localStorage.setItem('dnz_session',JSON.stringify({user,admin}));
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('userNameDisplay').textContent=user;
  const av=document.getElementById('userAv');
  av.textContent=user[0].toUpperCase();av.className='user-av '+(admin?'admin':'normal');
  document.getElementById('adminBadge').style.display=admin?'block':'none';
  document.getElementById('pillIcon').textContent=currentModel.icon;
  document.getElementById('pillName').textContent=currentModel.name;
  document.getElementById('pillCat').textContent=currentModel.cat;
  document.getElementById('headerModelName').textContent=currentModel.name;
  if(admin) document.getElementById('inputHint').innerHTML='Enter=trimite &nbsp;·&nbsp; !help pentru comenzi admin';
  renderChatsList();newChat();
}
function logout(){
  currentUser=null;isAdmin=false;currentChatId=null;messages=[];pendingImage=null;
  localStorage.removeItem('dnz_session');
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('authUser').value='';
  document.getElementById('authPass').value='';
  document.getElementById('authErr').textContent='';
  removeImage();switchTab('login');
  document.getElementById('modelDropdown').classList.remove('open');
}
window.addEventListener('load',()=>{
  try{
    const s=JSON.parse(localStorage.getItem('dnz_session'));
    if(s?.user){
      if(s.admin&&s.user===ADMIN_USER){startSession(s.user,true);return}
      if(getUsers()[s.user]) startSession(s.user,false);
    }
  }catch(e){}
});

// ── ADMIN COMMANDS ──
const adminHelp=`<table>
  <tr><th>Comandă</th><th>Descriere</th></tr>
  <tr><td style="color:var(--c2)">!help</td><td>Această listă</td></tr>
  <tr><td style="color:var(--c2)">!clear</td><td>Șterge toate chaturile</td></tr>
  <tr><td style="color:var(--c2)">!stats</td><td>Statistici cont</td></tr>
  <tr><td style="color:var(--c2)">!rename [text]</td><td>Redenumește chat curent</td></tr>
  <tr><td style="color:var(--c2)">!export</td><td>Exportă conversația ca .txt</td></tr>
  <tr><td style="color:var(--c2)">!theme dark/purple/cyan</td><td>Schimbă tema</td></tr>
  <tr><td style="color:var(--c2)">!sys [text]</td><td>Schimbă personalitatea AI</td></tr>
  <tr><td style="color:var(--c2)">!resetsys</td><td>Resetează personalitatea AI</td></tr>
  <tr><td style="color:var(--c2)">!models</td><td>Lista tuturor modelelor</td></tr>
</table>`;

function handleAdminCommand(cmd){
  const parts=cmd.trim().split(' ');
  const c=parts[0].toLowerCase();
  if(c==='!help'){showAdminPanel('📋 COMENZI ADMIN',adminHelp);return true}
  if(c==='!clear'){saveChats(currentUser,[]);newChat();showAdminPanel('✅','<div style="color:var(--c3)">Toate conversațiile șterse.</div>');return true}
  if(c==='!stats'){
    const chats=getChats(currentUser);
    const tot=chats.reduce((a,ch)=>a+(ch.messages||[]).filter(m=>m.role!=='system').length,0);
    showAdminPanel('📊 STATISTICI',`<table>
      <tr><th>Info</th><th>Valoare</th></tr>
      <tr><td>Username</td><td style="color:var(--c2)">${esc(currentUser)} 👑</td></tr>
      <tr><td>Conversații</td><td style="color:var(--c3)">${chats.length}</td></tr>
      <tr><td>Mesaje totale</td><td style="color:var(--c3)">${tot}</td></tr>
      <tr><td>Model activ</td><td style="color:var(--gold)">${currentModel.name}</td></tr>
      <tr><td>Personalitate</td><td style="color:var(--muted)">${customSysPrompt?'Custom':'Default'}</td></tr>
    </table>`);
    return true;
  }
  if(c==='!rename'){
    const n=parts.slice(1).join(' ').trim();
    if(!n){showAdminPanel('⚠️','<div style="color:var(--danger)">Folosire: !rename [nume]</div>');return true}
    renameChatById(currentChatId,n);
    document.getElementById('chatTitle').textContent=n;
    showAdminPanel('✅',`<div style="color:var(--c3)">Redenumit în: <b>${esc(n)}</b></div>`);
    return true;
  }
  if(c==='!export'){
    const chats=getChats(currentUser);
    const chat=chats.find(x=>x.id===currentChatId);
    if(!chat||!messages.length){showAdminPanel('⚠️','<div style="color:var(--danger)">Niciun mesaj de exportat.</div>');return true}
    let txt=`Conversație: ${chat.title}\nData: ${new Date().toLocaleString('ro')}\n${'─'.repeat(50)}\n\n`;
    messages.filter(m=>m.role!=='system').forEach(m=>{
      const role=m.role==='user'?`[${currentUser.toUpperCase()}]`:'[DENIZW AI]';
      const content=Array.isArray(m.content)?m.content.map(p=>p.type==='text'?p.text:'[imagine]').join(' '):m.content;
      txt+=`${role}\n${content}\n\n`;
    });
    downloadFile(chat.title.replace(/[^a-z0-9]/gi,'_')+'.txt',txt,'text/plain');
    showAdminPanel('✅ EXPORTAT','<div style="color:var(--c3)">Descărcat ca .txt</div>');
    return true;
  }
  if(c==='!theme'){
    const t=parts[1]?.toLowerCase();
    const themes={dark:{c1:'#e879f9',c2:'#38bdf8'},purple:{c1:'#a78bfa',c2:'#c084fc'},cyan:{c1:'#22d3ee',c2:'#67e8f9'}};
    if(!themes[t]){showAdminPanel('⚠️','<div style="color:var(--danger)">Teme: dark, purple, cyan</div>');return true}
    document.documentElement.style.setProperty('--c1',themes[t].c1);
    document.documentElement.style.setProperty('--c2',themes[t].c2);
    showAdminPanel('🎨',`<div style="color:var(--c3)">Temă: <b>${t}</b></div>`);
    return true;
  }
  if(c==='!sys'){
    const p=parts.slice(1).join(' ').trim();
    if(!p){showAdminPanel('⚠️','<div style="color:var(--danger)">Folosire: !sys [personalitate]</div>');return true}
    customSysPrompt=p;
    showAdminPanel('🧠',`<div style="color:var(--c3)">Personalitate setată: <b>${esc(p)}</b></div>`);
    return true;
  }
  if(c==='!resetsys'){customSysPrompt=null;showAdminPanel('🧠','<div style="color:var(--c3)">Personalitate resetată.</div>');return true}
  if(c==='!models'){
    let html='<table><tr><th>Model</th><th>Categorie</th><th>Acces</th></tr>';
    MODELS.forEach(m=>{html+=`<tr><td style="color:var(--c2)">${m.icon} ${m.name}</td><td style="color:var(--muted)">${m.section}</td><td style="color:${m.adminOnly?'var(--gold)':'var(--c3)'}">${m.adminOnly?'👑 Admin':'🆓 Free'}</td></tr>`});
    html+='</table>';
    showAdminPanel('🤖 MODELE DISPONIBILE',html);
    return true;
  }
  showAdminPanel('❓',`<div style="color:var(--danger)">Comandă necunoscută. Scrie <b>!help</b>.</div>`);
  return true;
}

function showAdminPanel(title,content){
  clearEmpty();
  const box=document.getElementById('chatbox');
  const div=document.createElement('div');
  div.className='msg system-msg';
  div.innerHTML=`<div class="av">👑</div><div class="admin-panel"><div class="ap-title">${title}</div>${content}</div>`;
  box.appendChild(div);box.scrollTop=box.scrollHeight;
}

// ── markdown ──
function renderMarkdown(text){
  text=text.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
    const cleanLang=lang.trim()||'text';
    const id='cb_'+Math.random().toString(36).slice(2,8);
    const extMap={javascript:'js',typescript:'ts',python:'py',lua:'lua',html:'html',css:'css',bash:'sh',shell:'sh',java:'java',cpp:'cpp',c:'c',rust:'rs',go:'go',json:'json',xml:'xml',yaml:'yml',sql:'sql',php:'php',ruby:'rb',swift:'swift',kotlin:'kt'};
    const ext=extMap[cleanLang.toLowerCase()]||cleanLang.toLowerCase()||'txt';
    return `<div class="code-wrap"><div class="code-header"><span class="code-lang">${cleanLang}</span><div class="code-btns"><button class="code-btn" onclick="copyCode('${id}',this)">📋 Copy</button><button class="code-btn" onclick="downloadCode('${id}','script.${ext}')">⬇ script.${ext}</button></div></div><pre><code id="${id}" class="language-${cleanLang}">${escHtml(code.trim())}</code></pre></div>`;
  });
  text=text.replace(/`([^`]+)`/g,'<code>$1</code>');
  text=text.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');
  text=text.replace(/\*(.*?)\*/g,'<i>$1</i>');
  text=text.replace(/\n/g,'<br>');
  return text;
}
function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}
function copyCode(id,btn){
  navigator.clipboard.writeText(document.getElementById(id)?.innerText||'').then(()=>{
    btn.textContent='✓ Copiat!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 Copy';btn.classList.remove('copied')},2000);
  });
}
function downloadCode(id,filename){downloadFile(filename,document.getElementById(id)?.innerText||'','text/plain')}
function downloadFile(filename,content,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

// ── image ──
function handleImageSelect(e){
  const file=e.target.files[0];if(!file)return;
  if(file.size>5*1024*1024){alert('Poza e prea mare (max 5MB).');return}
  const reader=new FileReader();
  reader.onload=ev=>{
    const dataUrl=ev.target.result;
    pendingImage={base64:dataUrl.split(',')[1],mimeType:file.type,dataUrl,name:file.name};
    document.getElementById('imgPreviewThumb').src=dataUrl;
    document.getElementById('imgPreviewName').textContent=file.name;
    document.getElementById('imgPreviewWrap').style.display='flex';
    document.getElementById('imgBtn').classList.add('has-img');
  };
  reader.readAsDataURL(file);e.target.value='';
}
function removeImage(){
  pendingImage=null;
  document.getElementById('imgPreviewWrap').style.display='none';
  document.getElementById('imgPreviewThumb').src='';
  document.getElementById('imgPreviewName').textContent='';
  document.getElementById('imgBtn').classList.remove('has-img');
}

// ── chats ──
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function newChat(){
  currentChatId=genId();messages=[];renderChatbox();
  document.getElementById('chatTitle').textContent='Chat nou';
  renderChatsList();closeSidebar();
  document.getElementById('userInput').focus();
}
function renameChatById(id,name){
  const chats=getChats(currentUser);
  const idx=chats.findIndex(c=>c.id===id);
  if(idx>=0){chats[idx].title=name;saveChats(currentUser,chats);}
  renderChatsList();
}
function renderChatsList(){
  const list=document.getElementById('chatsList');
  const chats=getChats(currentUser);
  list.innerHTML='';
  if(!chats.length){list.innerHTML='<div style="padding:12px;font-size:0.78rem;color:var(--muted);text-align:center;">Nicio conversație încă</div>';return}
  [...chats].reverse().forEach(c=>{
    const div=document.createElement('div');
    div.className='chat-item'+(c.id===currentChatId?' active':'');
    div.dataset.id=c.id;
    div.innerHTML=`<span class="chat-item-name">💬 ${esc(c.title)}</span><div class="chat-actions"><button class="ca-btn" onclick="startRename(event,'${c.id}')">✏️</button><button class="ca-btn del" onclick="deleteChat(event,'${c.id}')">✕</button></div>`;
    div.onclick=(e)=>{if(e.target.classList.contains('ca-btn')||e.target.classList.contains('chat-item-name-input'))return;loadChat(c.id)};
    div.ondblclick=(e)=>{if(e.target.tagName==='BUTTON')return;startRename(e,c.id)};
    list.appendChild(div);
  });
}
function startRename(e,id){
  e.stopPropagation();
  const item=document.querySelector(`.chat-item[data-id="${id}"]`);if(!item)return;
  const nameEl=item.querySelector('.chat-item-name');
  const cur=nameEl.textContent.replace('💬 ','').trim();
  const input=document.createElement('input');
  input.className='chat-item-name-input';input.value=cur;
  nameEl.replaceWith(input);input.focus();input.select();
  const finish=()=>{const n=input.value.trim()||cur;renameChatById(id,n);if(id===currentChatId)document.getElementById('chatTitle').textContent=n;};
  input.onblur=finish;
  input.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault();input.blur();}if(e.key==='Escape'){input.value=cur;input.blur();}};
}
function saveCurrentChat(title){
  const chats=getChats(currentUser);
  const idx=chats.findIndex(c=>c.id===currentChatId);
  const lightMsgs=messages.map(m=>{
    if(Array.isArray(m.content))return{...m,content:m.content.map(p=>p.type==='image_url'?{type:'image_url',image_url:{url:'[image]'}}:p)};
    return m;
  });
  const obj={id:currentChatId,title:title||'Chat nou',messages:lightMsgs,ts:Date.now()};
  if(idx>=0)chats[idx]=obj;else chats.push(obj);
  saveChats(currentUser,chats);renderChatsList();
}
function loadChat(id){
  const c=getChats(currentUser).find(x=>x.id===id);if(!c)return;
  currentChatId=id;messages=c.messages||[];
  document.getElementById('chatTitle').textContent=c.title;
  renderChatbox(true);renderChatsList();closeSidebar();
}
function deleteChat(e,id){
  e.stopPropagation();
  saveChats(currentUser,getChats(currentUser).filter(c=>c.id!==id));
  if(currentChatId===id)newChat();else renderChatsList();
}
function renderChatbox(){
  const box=document.getElementById('chatbox');box.innerHTML='';
  if(!messages.length){
    box.innerHTML=`<div class="empty" id="emptyState">
      <div class="empty-icon">${isAdmin?'👑':'🤖'}</div>
      <h2>${isAdmin?'Bun venit, lider! 👑':'Bun venit la Denizw!'}</h2>
      <p>${isAdmin?'Scrie !help pentru comenzi. Folosești: '+currentModel.name:'Folosești: '+currentModel.name+' · Schimbă modelul din sidebar'}</p>
      <div class="suggestions">
        <button class="sug-btn" onclick="suggest(this)">${isAdmin?'!help':'Ce poți face?'}</button>
        <button class="sug-btn" onclick="suggest(this)">${isAdmin?'!stats':'Explică-mi Minecraft'}</button>
        <button class="sug-btn" onclick="suggest(this)">Scrie un script Lua Roblox</button>
        <button class="sug-btn" onclick="suggest(this)">Spune o glumă</button>
      </div></div>`;
    return;
  }
  messages.forEach(m=>{
    if(m.role==='system')return;
    if(Array.isArray(m.content)){
      let ih='',th='';
      m.content.forEach(p=>{
        if(p.type==='image_url'){const src=p.image_url.url==='[image]'?'':p.image_url.url;ih=src?`<img src="${src}" alt="img"/>`:`<div style="font-size:0.78rem;color:var(--muted)">🖼 [imagine]</div>`;}
        if(p.type==='text')th=esc(p.text);
      });
      addMsgEl('user',ih+(th?`<div style="margin-top:${ih?'6px':'0'}">${th}</div>`:''),false);
    } else {
      addMsgEl(m.role==='user'?'user':'ai',m.role==='ai'?renderMarkdown(m.content):esc(m.content),false);
    }
  });
  box.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
  box.scrollTop=box.scrollHeight;
}
function clearEmpty(){const e=document.getElementById('emptyState');if(e)e.remove()}
function addMsgEl(role,html,animate=true){
  clearEmpty();
  const box=document.getElementById('chatbox');
  const div=document.createElement('div');
  div.className='msg '+role+(isAdmin&&role==='user'?' is-admin':'');
  if(!animate)div.style.animation='none';
  div.innerHTML=`<div class="av">${role==='user'?(isAdmin?'👑':'👤'):'✦'}</div><div class="bbl">${html}</div>`;
  box.appendChild(div);
  div.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
  box.scrollTop=box.scrollHeight;
  return div;
}
function addTyping(){
  clearEmpty();
  const box=document.getElementById('chatbox');
  const div=document.createElement('div');
  div.className='msg ai';div.id='typing-ind';
  div.innerHTML=`<div class="av">✦</div><div class="bbl"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  box.appendChild(div);box.scrollTop=box.scrollHeight;
}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function suggest(btn){document.getElementById('userInput').value=btn.textContent;sendMessage()}

async function sendMessage(){
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text&&!pendingImage)return;
  if(isAdmin&&text.startsWith('!')){const h=handleAdminCommand(text);if(h){input.value='';input.style.height='auto';return}}
  input.value='';input.style.height='auto';
  document.getElementById('sendBtn').disabled=true;
  let userContent,displayHtml='';
  if(pendingImage){
    userContent=[{type:'image_url',image_url:{url:`data:${pendingImage.mimeType};base64,${pendingImage.base64}`}}];
    displayHtml=`<img src="${pendingImage.dataUrl}" alt="img"/>`;
    if(text){userContent.push({type:'text',text});displayHtml+=`<div style="margin-top:6px">${esc(text)}</div>`;}
    removeImage();
  } else {userContent=text;displayHtml=esc(text);}
  addMsgEl('user',displayHtml);
  messages.push({role:'user',content:userContent});
  if(messages.filter(m=>m.role==='user').length===1){
    const title=(text||'Imagine').slice(0,40)+((text||'').length>40?'…':'');
    document.getElementById('chatTitle').textContent=title;
  }
  addTyping();
  const sys=customSysPrompt||(isAdmin
    ?`Ești Denizw AI. Utilizatorul "${currentUser}" este LIDERUL și administratorul. Tratează-l cu respect, numește-l "lider". Când dai cod, folosește blocuri de cod cu limbajul specificat. Răspunde în română dacă ți se vorbește în română.`
    :`Ești Denizw AI, asistent prietenos. Utilizatorul se numește "${currentUser}". Când dai cod, folosește blocuri de cod cu limbajul specificat. Răspunde în română dacă ți se vorbește în română. Fii concis și util.`);
  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_API_KEY},
      body:JSON.stringify({model:currentModel.id,messages:[{role:'system',content:sys},...messages],max_tokens:2048})
    });
    const data=await res.json();
    document.getElementById('typing-ind')?.remove();
    if(data.error){addMsgEl('ai','❌ Eroare: '+esc(data.error.message));}
    else{
      const reply=data.choices[0].message.content;
      messages.push({role:'assistant',content:reply});
      addMsgEl('ai',renderMarkdown(reply));
      saveCurrentChat(document.getElementById('chatTitle').textContent);
    }
  }catch(err){
    document.getElementById('typing-ind')?.remove();
    addMsgEl('ai','❌ Eroare de conexiune.');
  }
  document.getElementById('sendBtn').disabled=false;
  input.focus();
}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
</script>
</body>
</html>
